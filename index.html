<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Coin - FaucetPay Withdrawal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 350px; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 1.5rem; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #334155; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0ea5e9; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #0284c7; }
        #status { margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Withdraw Reward</h2>
        <input type="text" id="address" placeholder="FaucetPay Email or Wallet">
        <input type="number" id="amount" placeholder="Amount (Satoshi)">
        <select id="currency">
            <option value="USDT">USDT</option>
            <option value="BTC">BTC</option>
            <option value="TRX">TRX</option>
        </select>
        <button onclick="requestWithdraw()">Withdraw Now</button>
        <div id="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
